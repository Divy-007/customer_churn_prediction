services:
  api:
    build:
      context: .
      dockerfile: dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      # inside Docker's network, containers reach each other by service name,
      # NOT localhost — this overrides streamlit.py's default API_URL
      - API_URL=http://api:8000/predict
    depends_on:
      - api
    restart: unless-stopped